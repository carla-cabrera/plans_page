<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your REVER plan</title>

<style>
  :root {
    --navy: #000d1f;
    --blue: #1790ff;
    --bg: #f5f8fc;
    --surface: #ffffff;
    --border: #d6dde8;
    --text: #000d1f;
    --text-secondary: #5b6778;
    --button-bg: #000d1f;
    --button-text: #ffffff;
    --link: #0b6fcc;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000d1f;
      --surface: #0d2038;
      --border: #1c3250;
      --text: #f2f6fc;
      --text-secondary: #93a3ba;
      --button-bg: #1790ff;
      --button-text: #ffffff;
      --link: #5eb0ff;
    }
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 72px 24px 56px;
  }

  main {
    width: 100%;
    max-width: 1040px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #content {
    width: 100%;
  }
  .logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 28px;
    background: var(--navy);
  }
  .logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0 0 8px;
    text-align: center;
    line-height: 1.15;
  }
  .subtitle {
    font-size: 16px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0 auto 48px;
    text-align: center;
    max-width: 420px;
  }
  .plans {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    width: 100%;
    align-items: stretch;
  }
  .plan-card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 44px 32px 36px;
  }
  .plan-card {
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .plan-card.selected {
    border: 2px solid var(--blue);
    box-shadow: 0 8px 28px rgba(23, 144, 255, 0.18);
  }
  .plan-tab {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 28px;
  }
  .plan-price-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .plan-price {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .plan-period {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .plan-note {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 18px 0 0;
    line-height: 1.6;
    text-align: center;
  }
  .plan-note strong {
    color: var(--text);
    font-weight: 600;
  }
  .plan-note .save {
    color: var(--link);
    font-weight: 600;
  }
  .plan-monthly {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 10px 0 0;
    line-height: 1.6;
    text-align: center;
  }
  .plan-monthly strong {
    color: var(--text);
    font-weight: 600;
  }
  .plan-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    text-align: center;
    margin: 28px 0 0;
    flex: 1;
  }
  .plan-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 980px;
    background: var(--button-bg);
    color: var(--button-text);
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 32px;
  }
  .plan-btn:hover {
    opacity: 0.88;
  }
  .plan-btn:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }
  .footnote {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 40px;
    text-align: center;
  }
  .error {
    font-size: 15px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 40px;
    line-height: 1.5;
  }
  @media (max-width: 900px) {
    .plans {
      grid-template-columns: 1fr;
      gap: 24px;
    }
  }
  @media (max-width: 560px) {
    .plans {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .plan-card {
      padding: 36px 28px 30px;
    }
  }

  @media (max-width: 420px) {
    body {
      padding-top: 48px;
    }
    h1 {
      font-size: 26px;
    }
    .plan-price {
      font-size: 34px;
    }
  }
</style>
</head>

<body>

<main>
  <div id="content">
    <div class="logo">
      <img src="logo.png" alt="REVER" onerror="this.parentNode.style.display='none'">
    </div>
    <h1>Choose your plan</h1>
    <p class="subtitle">Pick the option that works best for you.</p>
    <div class="plans" id="plans"></div>
    <p class="footnote">Secure checkout by Stripe.</p>
  </div>

  <p class="error" id="errorMsg" style="display:none;">
    This link is missing information. Please contact us for a new payment link.
  </p>
</main>

<script>
(function () {
  var ALLOWED_HOSTS = ["buy.stripe.com", "pay.itsrever.com"];
  var q = new URLSearchParams(window.location.search);
  function okUrl(url) {
    try {
      var parsedUrl = new URL(url);
      if (parsedUrl.protocol !== "https:") {
        return false;
      }
      if (ALLOWED_HOSTS.indexOf(parsedUrl.hostname) === -1) {
        return false;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  function okNum(number) {
    return /^\d+(\.\d{1,2})?$/.test(number || "");
  }
  function money(number) {
    var value = Number(number);
    var formattedValue = value.toLocaleString("en-GB", {
      minimumFractionDigits: value % 1 ? 2 : 0,maximumFractionDigits: 2
    });
    return "€" + formattedValue;
  }
  var months = parseInt(q.get("cp"), 10);
  if ([1, 3, 6, 12].indexOf(months) === -1) {
    months = 1;
  }
  var isAnnual = false;
  if (q.get("ia") === "1") {
    isAnnual = true;
  }
  var cadence = "";
  if (months === 1) {
    cadence = "monthly";
  } else if (months === 12) {
    cadence = "annually";
  } else {
    cadence = "every " + months + " months";
  }
  var cycle = "";
  if (months === 1) {
    cycle = "per month";
  } else if (months === 12) {
    cycle = "per year";
  } else {
    cycle = "every " + months + " months";
  }

  var plans = [];

  if (okUrl(q.get("cu")) && okNum(q.get("ca"))) {
    var currentPeriod = "";

    if (isAnnual) {
      currentPeriod = "per year";
    } else {
      currentPeriod = cycle;
    }

    var currentDescription = "";

    if (isAnnual) {
      currentDescription = "Your REVER annual plan continues exactly as it is today.";
    } else {
      currentDescription = "Your REVER plan continues exactly as it is today.";
    }

    plans.push({
      tab: "Current plan",
      price: money(q.get("ca")),
      period: currentPeriod,
      note: "No changes — keep paying as originally agreed.",
      monthly: "",
      desc: currentDescription,
      cta: "Continue with your current plan",
      url: q.get("cu")
    });
  }

  if (!isAnnual && okUrl(q.get("au")) && okNum(q.get("aa"))) {
    var annualMonthly = Number(q.get("aa")) / 12;
    var annualNote = "Billed as <strong>" + money(q.get("aa")) + "</strong> once a year — <span class=\"save\">10% discount</span> based on your agreed monthly rate.";
    plans.push({
      tab: "Annual",
      price: money(q.get("aa")),
      period: "per year",
      note: annualNote,
      monthly: "Equivalent to <strong>" + money(annualMonthly) + "/month</strong>",
      desc: "Same REVER plan and features, billed once a year instead of " + cadence + ".",
      cta: "Continue with the annual plan",
      url: q.get("au")
    });
  }

  if (okUrl(q.get("tu")) && okNum(q.get("ta"))) {
    var twoYearMonthly = Number(q.get("ta")) / 24;
    var twoYearNote = "Billed as <strong>" + money(q.get("ta")) + "</strong> every 2 years — <span class=\"save\">20% discount</span> based on your agreed monthly rate.";

    plans.push({
      tab: "2 years",
      price: money(q.get("ta")),
      period: "every 2 years",
      note: twoYearNote,
      monthly: "Equivalent to <strong>" + money(twoYearMonthly) + "/month</strong>",
      desc: "Same REVER plan and features, billed once every two years instead of " + cadence + ".",
      cta: "Continue with the 2-year plan",
      url: q.get("tu")
    });
  }

  if (plans.length === 0) {
    document.getElementById("content").style.display = "none";
    document.getElementById("errorMsg").style.display = "block";
    return;
  }

  var plansEl = document.getElementById("plans");
  var cards = [];
  var annualCard = null;

  function selectCard(card) {
    cards.forEach(function (c) {
      c.classList.remove("selected");
    });
    card.classList.add("selected");
  }

  plans.forEach(function (plan) {
    var card = document.createElement("div");
    card.className = "plan-card";
    var monthlyHtml = "";
    if (plan.monthly) {
      monthlyHtml = "<p class=\"plan-monthly\">" + plan.monthly + "</p>";
    }
    card.innerHTML ="<p class=\"plan-tab\">" + plan.tab + "</p>" + "<div class=\"plan-price-row\">" +"<span class=\"plan-price\">" + plan.price + "</span>" +"<span class=\"plan-period\">" + plan.period + "</span>" +"</div>" + "<p class=\"plan-note\">" + plan.note + "</p>" +monthlyHtml +"<p class=\"plan-desc\">" + plan.desc + "</p>" +"<button type=\"button\" class=\"plan-btn\">" + plan.cta + "</button>";
    card.addEventListener("click", function () {
      selectCard(card);
    });
    card.querySelector(".plan-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      selectCard(card);
      window.location.href = plan.url;
    });
    plansEl.appendChild(card);
    cards.push(card);

    if (plan.tab === "Annual") {
      annualCard = card;
    }
  });
  selectCard(annualCard ||cards[0]);
})();
</script>

</body>
</html>
